name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tcp-echo-server.sln

      - name: Build
        run: dotnet build tcp-echo-server.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tcp-echo-server.sln --configuration Release --no-build
